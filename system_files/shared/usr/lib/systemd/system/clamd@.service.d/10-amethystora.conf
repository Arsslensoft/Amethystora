[Unit]
# The image ships no virus signatures: clamd cannot start until clamav-freshclam.service has downloaded
# them after the first boot. Keep retrying instead of giving up after a few quick failures.
Wants=clamav-freshclam.service
After=clamav-freshclam.service
StartLimitIntervalSec=0
# Started by its socket (clamd@.socket) when something scans
Requires=clamd@%i.socket
After=clamd@%i.socket

[Service]
# Nothing holds the signatures in memory while VIRUS_SCAN=off in /etc/amethystora/security.conf
ExecCondition=/usr/libexec/amethystora-security-config --is VIRUS_SCAN manual weekly
RestartSec=60
# In the foreground: a clamd that forks would no longer be the process systemd handed the socket to, and
# would make one of its own instead
Type=simple
ExecStart=
ExecStart=/usr/sbin/clamd -c /etc/clamd.d/%i.conf --foreground=yes
# clamd parses every file of every account, so it is given what it needs and no more. Every caller passes it
# the file as a descriptor it opened itself (clamdscan --fdpass in the weekly scan, the quarantine's rescan and
# the Security app, clamonacc --fdpass) or as bytes on the socket (clamdscan -), so clamd opens no path of an
# account and needs no home, no network and no write access. It starts as root and drops to User clamscan.
CapabilityBoundingSet=CAP_SETUID CAP_SETGID
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
PrivateNetwork=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictAddressFamilies=AF_UNIX
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
