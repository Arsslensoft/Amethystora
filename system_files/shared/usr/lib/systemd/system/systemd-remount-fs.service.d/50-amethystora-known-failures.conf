# A composefs root cannot be remounted, which Anaconda's fstab asks for on every start (/usr/libexec/amethystora-early-units).
# In an initramfs without the helper, systemd's own program as before
[Service]
ExecStart=
ExecStart=/bin/sh -c 'if [ -x /usr/libexec/amethystora-early-units ]; then exec /usr/libexec/amethystora-early-units remount-fs; fi; exec /usr/lib/systemd/systemd-remount-fs'
