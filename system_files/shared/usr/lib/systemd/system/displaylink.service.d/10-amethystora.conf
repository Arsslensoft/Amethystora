# DisplayLinkManager needs evdi, which the package's unit loads in ExecStartPre= and restarts after every five
# seconds without end. With Secure Boot on, the kernel refuses evdi until Amethystora's key is enrolled
# (ame security secure-boot), so such a machine had the unit failing every five seconds from boot. Loading it
# is a condition here: without evdi the unit is skipped, not failed, and tried again at the next boot or when
# a dock is plugged in. It runs outside the sandbox (20-amethystora-sandbox.conf: "+"), which keeps every other
# command from loading modules.
[Unit]
# A manager that keeps crashing is not started again for good: ten starts in five minutes, then it waits for
# `systemctl reset-failed displaylink.service` or the next boot. A dock plugged in and out by hand stays far under it
StartLimitIntervalSec=5min
StartLimitBurst=10

[Service]
ExecStartPre=
ExecCondition=+/usr/sbin/modprobe evdi
# The package's suspend hook (system-sleep/displaylink) talks to the manager through FIFOs in /tmp. With no
# manager running, as on a machine that suspended before its dock was plugged in, it leaves a plain file where
# the manager makes its FIFO: clear those, never a FIFO
ExecStartPre=-/usr/bin/find /tmp -maxdepth 1 -name 'PmMessagesPort_*' -type f -delete
