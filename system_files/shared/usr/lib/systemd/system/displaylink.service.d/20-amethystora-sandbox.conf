[Service]
# Any USB device can say it is DisplayLink's (vendor 17e9), and the manager, a closed program, parses what it answers
# as root (audit of 2026-11-16, Z-2): the sandbox keeps a fault in it from reaching more of the machine. Drawn from
# what the package and the program name, without a dock to try it on: the manager reaches the dock through libusb
# (/dev/bus/usb), its screens through libevdi (/sys/devices/evdi and the DRM card it makes), writes its logs to
# /var/log/displaylink and /tmp/.dl.log, reads /proc/cpuinfo, and sets its threads' real-time priority. So it keeps
# /dev, /sys and /tmp (the suspend hook's FIFOs are the host's /tmp), CAP_SYS_NICE and real-time scheduling, and
# root's other powers over devices; it loses the rest of the file system for writing, the homes, the network beyond
# this machine, the kernel's settings and modules, and the powers a display driver has no use for. Tried without a
# dock (2026-11-17, Fedora 45, systemd 262): it starts, idles and answers the suspend hook as without the sandbox,
# which refuses it only clone3 (glibc falls back) and a larger netlink buffer (CAP_NET_ADMIN). If a dock stays dark
# with it, `sudo ln -s /dev/null /etc/systemd/system/displaylink.service.d/20-amethystora-sandbox.conf` and
# `sudo systemctl daemon-reload` take this file away to tell (the manual's common problems say so)
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/log/displaylink /tmp
ProtectHome=yes
# The settings that run a program as root (core_pattern, the uevent helper, modprobe's path) and SysRq stay as they
# are; the rest of /sys stays writable for evdi, which is why ProtectKernelTunables= is not used
ReadOnlyPaths=/proc/sys /proc/sysrq-trigger -/sys/kernel/uevent_helper
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RemoveIPC=yes
KeyringMode=private
# libusb hears devices come and go over netlink, which a network namespace of its own would not hear: no
# PrivateNetwork=, and no address beyond this machine instead
RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_INET6
IPAddressDeny=any
IPAddressAllow=localhost
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
CapabilityBoundingSet=~CAP_SYS_MODULE CAP_SYS_BOOT CAP_SYS_TIME CAP_SYS_PTRACE CAP_SYS_RAWIO CAP_SYS_PACCT CAP_SYS_TTY_CONFIG CAP_MAC_ADMIN CAP_MAC_OVERRIDE CAP_LINUX_IMMUTABLE CAP_SETUID CAP_SETGID CAP_SETPCAP CAP_SETFCAP CAP_NET_ADMIN CAP_NET_RAW CAP_BPF CAP_PERFMON CAP_SYSLOG CAP_AUDIT_CONTROL CAP_AUDIT_READ CAP_AUDIT_WRITE CAP_CHECKPOINT_RESTORE CAP_MKNOD CAP_WAKE_ALARM CAP_BLOCK_SUSPEND CAP_LEASE CAP_KILL CAP_CHOWN CAP_FOWNER CAP_FSETID CAP_IPC_OWNER CAP_NET_BIND_SERVICE CAP_NET_BROADCAST
