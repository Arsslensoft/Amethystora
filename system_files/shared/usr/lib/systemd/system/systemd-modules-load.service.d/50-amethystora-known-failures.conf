# A module refused for its key is the driver check's to say, not a reason for every start to end "degraded"
# (/usr/libexec/amethystora-early-units). In an initramfs without the helper, systemd's own program as before
[Service]
ExecStart=
ExecStart=/bin/sh -c 'if [ -x /usr/libexec/amethystora-early-units ]; then exec /usr/libexec/amethystora-early-units modules-load; fi; exec /usr/lib/systemd/systemd-modules-load'
