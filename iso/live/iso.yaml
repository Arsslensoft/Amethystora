# The boot menu of the live ISO, read by Titanoboa from /usr/lib/bootc-image-builder/iso.yaml in the
# live system (the container-native ISO contract). The label is the ISO's volume name, which the
# kernel arguments find the squashed system by. SELinux stays permissive in the live session, whose
# squashed files carry no labels; the installed system enforces it. systemd.tty.term.console=dumb is the
# image's own (usr/lib/bootc/kargs.d/12-amethystora-console.toml), which a live boot does not read: without
# it, systemd now and then waits forever for the console's size while Plymouth holds the console.
label: Amethystora-Live
grub2:
  default: 0
  timeout: 10
  entries:
    - name: "Try or install Amethystora"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=Amethystora-Live enforcing=0 rd.live.image systemd.tty.term.console=dumb"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Try or install Amethystora, in basic graphics mode"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=Amethystora-Live enforcing=0 rd.live.image systemd.tty.term.console=dumb nomodeset"
      initrd: "/images/pxeboot/initrd.img"
    # The forensic start (iso/live/forensic, manual: forensic-start.md): amethystora.forensic=1 is what its units look for,
    # the rest keeps the initramfs and systemd from swapping, resuming, assembling or activating anything on the disks. A
    # menu entry has no help text: its name says what it is and is not. No quote in it, which Titanoboa writes between quotes
    - name: "Start without touching the disks (software read-only, not a hardware write blocker)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=Amethystora-Live enforcing=0 rd.live.image systemd.tty.term.console=dumb amethystora.forensic=1 systemd.swap=0 fstab=0 noswap systemd.zram=0 systemd.gpt_auto=0 noresume rd.auto=0 rd.lvm=0 rd.md=0 rd.dm=0 rd.luks=0 rd.multipath=0 nodmraid noiswmd"
      initrd: "/images/pxeboot/initrd.img"
