# Amethystora's look for the installer, from branding/generate.mjs. Anaconda reads conf.d after the
# profile it detects (profile.d/amethystora.conf, which takes Fedora's settings), so this stylesheet
# replaces the one the Fedora profile names.

#
# From Fedora 45 the installer is Anaconda's web interface, which has a page for each module the ISO
# turns off (iso/iso.toml): the network, the date and time, and the account, which GNOME Initial
# Setup creates at the first boot. Their pages are hidden, as the live ISO's profile hides the account's.

[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/amethystora/amethystora.css
hidden_webui_pages = anaconda-screen-network anaconda-screen-date-time anaconda-screen-accounts
