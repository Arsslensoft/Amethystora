name: Install cargo-deny
description: >-
  Installs a pinned release of cargo-deny, checked against the SHA-256 pinned beside it, into /usr/local/bin, for the
  Checks workflow's crates (apps/deny.toml). Renovate bumps the version and the checksum together
  (.github/renovate.json5).

runs:
  using: composite
  steps:
    - name: Install cargo-deny
      shell: bash
      env:
        CARGO_DENY_VERSION: 0.20.2
        CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
      run: |
        name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
        archive="${RUNNER_TEMP}/cargo-deny.tar.gz"
        curl --fail --retry 3 -sSL -o "${archive}" \
          "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
        echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum -c -
        sudo tar -xzf "${archive}" -C /usr/local/bin --strip-components=1 "${name}/cargo-deny"
        rm -f "${archive}"
        cargo-deny --version
