name: Build ISO
on:
  pull_request:
    branches:
      - main
    paths:
      - "iso/**"
      - ".github/workflows/build-iso.yml"
  workflow_call:
    inputs:
      image:
        description: "The image the ISO installs: amethystora, amethystora-dx, amethystora-nvidia-open, amethystora-dx-nvidia-open, amethystora-nvidia-lts or amethystora-dx-nvidia-lts"
        type: string
        default: amethystora
  workflow_dispatch:
    inputs:
      image:
        description: "The image the ISO installs"
        type: choice
        default: amethystora
        options:
          - amethystora
          - amethystora-dx
          - amethystora-nvidia-open
          - amethystora-dx-nvidia-open
          - amethystora-nvidia-lts
          - amethystora-dx-nvidia-lts

# The installer ISO of a published stable image, built with bootc-image-builder and uploaded to
# Cloudflare R2, which GitHub cannot host: a Release asset is limited to 2 GiB. Each upload replaces
# the last one under the same name, so the download link never changes. Each of the six stable images
# has its ISOs.
#
# Each also gets a live ISO (the live-iso job), the one the website offers first: it boots into
# Amethystora, which can be tried without installing anything, and installs from there. Named after the
# image, as amethystora.iso, for https://download.amethystora.org/amethystora.iso. The installer ISO, the
# only one that also starts computers without UEFI, is <image>-non-uefi.iso.
#
# Both are built from one digest of the published image, resolved and checked against cosign.pub once
# (the image job), so that the image cannot change between the check and either build. The builders run
# privileged, so neither job holds a secret: each hands its ISO to the publish job, on a runner of its
# own, which works out the checksum again from what it received, signs it and uploads. Only main
# publishes: pull requests, and dispatches from any other branch, build the ISOs and stop there.
#
# Secrets (publish job only): R2_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY (an R2 API token
# with Object Read & Write on the bucket), R2_BUCKET, and SIGNING_SECRET, which signs the checksum as it
# signs the image.

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-iso-${{ inputs.image || 'amethystora' }}
  cancel-in-progress: true

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: ${{ inputs.image || 'amethystora' }}
    outputs:
      digest: ${{ steps.verify.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # Everything on both ISOs is the published image, so it is checked first against the key every
      # update is checked against, by the digest both builds then use
      - name: Verify the image
        id: verify
        run: |
          case "${IMAGE}" in
            amethystora | amethystora-dx | amethystora-nvidia-open | amethystora-dx-nvidia-open | amethystora-nvidia-lts | amethystora-dx-nvidia-lts) ;;
            *) echo "::error::${IMAGE} has no ISO: it is not one of the six stable images"; exit 1 ;;
          esac
          digest="$(skopeo inspect --retry-times 3 "docker://ghcr.io/arsslensoft/${IMAGE}:stable" | jq -r .Digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign verify --key cosign.pub "ghcr.io/arsslensoft/${IMAGE}@${digest}" > /dev/null
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  build-iso:
    name: ISO
    needs: [image]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      IMAGE: ${{ inputs.image || 'amethystora' }}
      ISO: ${{ inputs.image || 'amethystora' }}-non-uefi.iso
      DIGEST: ${{ needs.image.outputs.digest }}

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # master
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the image
        run: |
          case "${IMAGE}" in
            amethystora | amethystora-dx | amethystora-nvidia-open | amethystora-dx-nvidia-open | amethystora-nvidia-lts | amethystora-dx-nvidia-lts) ;;
            *) echo "::error::${IMAGE} has no ISO: it is not one of the six stable images"; exit 1 ;;
          esac

      # The image is pulled by the digest the image job checked and given its tag only in this runner's store, where the
      # builder looks for it: nothing is pulled by tag. iso/build-installer-iso.sh is the rest, which the Lab (ISOs)
      # workflow runs on the commit's own image, and says why each step is as it is
      - name: Build ISO
        env:
          IMAGE_REF: ghcr.io/arsslensoft/${{ env.IMAGE }}:stable
        run: |
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' |
            sudo tee /etc/containers/storage.conf > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio isomd5sum xorriso
          sudo podman pull "${IMAGE_REF%:*}@${DIGEST}"
          sudo podman tag "${IMAGE_REF%:*}@${DIGEST}" "${IMAGE_REF}"
          sudo bash iso/build-installer-iso.sh "${IMAGE_REF}" "upload/${ISO}"

      - name: Hand the ISO to the publish job
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: upload/${{ env.ISO }}
          archive: false
          if-no-files-found: error
          retention-days: 1

  # The live ISO of the image: boot it from a USB stick, try Amethystora without installing anything,
  # and install it from there with Anaconda, offline. Titanoboa (ublue-os/titanoboa, Apache-2.0) squashes
  # a live system into a UEFI-only ISO; the live system is the published image with the live boot, the
  # live session and the installer added (iso/live), and a copy of the image itself, which is what gets
  # installed. Titanoboa is pinned to a commit of its main branch, newer than its last tag, from the first
  # that takes nothing but that image: everything else is in the image, the offline copy in the image store
  # /usr/lib/containers/storage, which iso/live/build.sh fills around podman 6's refusal (ublue-os/titanoboa#151).
  live-iso:
    name: Live ISO
    needs: [image]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      IMAGE_REF: ghcr.io/arsslensoft/${{ inputs.image || 'amethystora' }}:stable
      DIGEST: ${{ needs.image.outputs.digest }}
      ISO: ${{ inputs.image || 'amethystora' }}.iso

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # master
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # sys_admin and no SELinux label for the build, which pulls the image into the live system's own
      # image store and rebuilds its initramfs. Both the live system and the copy it carries are the
      # digest the image job checked (iso/live/Containerfile)
      - name: Build the live system
        run: |
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' |
            sudo tee /etc/containers/storage.conf > /dev/null
          sudo podman pull "${IMAGE_REF%:*}@${DIGEST}"
          sudo podman build --cap-add sys_admin --security-opt label=disable \
            --build-arg BASE_IMAGE="${IMAGE_REF}" --build-arg BASE_DIGEST="${DIGEST}" \
            --tag localhost/amethystora-live:stable --file iso/live/Containerfile iso

      # Titanoboa builds the ISO in quay.io/fedora/fedora:latest, with CAP_SYS_ADMIN, and the ISO is signed
      # after: that name is made the Fedora the Justfile pins by digest, which podman finds and does not pull
      - name: Pin the Fedora Titanoboa builds in
        run: |
          fedora="$(sed -nE 's/^fedora_image := "([^"]+):[^:@"]+@(sha256:[a-f0-9]{64})"$/\1@\2/p' Justfile)"
          [[ -n "${fedora}" ]]
          sudo podman pull "${fedora}"
          sudo podman tag "${fedora}" quay.io/fedora/fedora:latest

      # Titanoboa resolves iso-dest against its own folder, not the workspace, so the ISO is read from
      # wherever its iso-dest output says it went
      - name: Build ISO
        id: titanoboa
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4 # main
        with:
          image-ref: localhost/amethystora-live:stable

      # What the live system is made of, for the ISO to carry beside NOTICE, whose written offer covers
      # it. Fedora's trademark guidelines keep its logo and release packages out of a system built from
      # Fedora, as they are kept out of the image and the installer ISO: this fails before the upload if
      # the live session's packages brought one back.
      - name: List the live system's packages
        run: |
          sudo podman run --rm --entrypoint rpm localhost/amethystora-live:stable \
            -qa --queryformat '%{NAME}\t%{VERSION}-%{RELEASE}\t%{LICENSE}\n' | sort > LIVE-PACKAGES
          if awk -F'\t' '$1 == "fedora-logos" || $1 ~ /^fedora-release/ { found = 1 } END { exit !found }' LIVE-PACKAGES; then
            echo "::error::The live system carries Fedora's logo or release package"
            exit 1
          fi

      - name: Add the licences
        env:
          LIVE_ISO: ${{ steps.titanoboa.outputs.iso-dest }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso
          mkdir upload
          # replay keeps the boot records Titanoboa wrote
          xorriso -indev "${LIVE_ISO}" -outdev "upload/${ISO}" -boot_image any replay \
            -map LICENSE /LICENSE -map NOTICE /NOTICE -map LIVE-PACKAGES /LIVE-PACKAGES

      # The boot menu the ISO really carries: the forensic start is an entry of it, with every argument that keeps the
      # initramfs and systemd off the disks (iso/live/forensic, which build.sh holds to the same list), and no other
      # entry has them. The arguments are the ones `amethystora-forensic args` prints in the live system
      - name: Check the boot menu
        run: |
          xorriso -osirrox on -indev "upload/${ISO}" -extract /boot/grub2/grub.cfg grub.cfg
          grep -qF "menuentry 'Start without touching the disks" grub.cfg
          entry="$(grep -A1 -F "menuentry 'Start without touching the disks" grub.cfg | grep -E '^ +linux ')"
          for arg in $(sed -n '/^ARGS=(/,/)$/p' iso/live/forensic/amethystora-forensic | sed -e 's/^ARGS=(//' -e 's/)$//'); do
            [[ " ${entry} " == *" ${arg} "* ]] || { echo "::error::The forensic boot entry lacks ${arg}"; exit 1; }
          done
          [[ "$(grep -cE '^ +linux .*amethystora\.forensic=1' grub.cfg)" == 1 ]]
          [[ "$(grep -cE '^menuentry ' grub.cfg)" == 3 ]]

      - name: Hand the ISO to the publish job
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: upload/${{ env.ISO }}
          archive: false
          if-no-files-found: error
          retention-days: 1

  # Each ISO is signed and uploaded on a fresh runner that ran none of the builders, the only place the
  # signing key and the R2 token are. The checksum is computed here, from the bytes received. One leg per
  # ISO, so that one that failed to build does not hold the other back.
  publish:
    name: Publish ${{ matrix.iso }}
    needs: [build-iso, live-iso]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (needs.build-iso.result == 'success' || needs.live-iso.result == 'success') }}
    runs-on: ubuntu-latest
    # The signing key and the bucket's token are the release environment's, which admits main and beta
    environment: release
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        iso:
          - ${{ inputs.image || 'amethystora' }}-non-uefi.iso
          - ${{ inputs.image || 'amethystora' }}.iso
    env:
      ISO: ${{ matrix.iso }}

    steps:
      - name: Download the ISO
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.iso }}
          path: upload

      - name: Checksum
        working-directory: upload
        run: |
          test -f "${ISO}"
          sha256sum "${ISO}" | tee "${ISO}.sha256"

      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign checksum
        working-directory: upload
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign sign-blob -y --key env://COSIGN_PRIVATE_KEY --bundle "${ISO}.sha256.bundle" "${ISO}.sha256"

      - name: Upload to Cloudflare R2
        working-directory: upload
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # As Cloudflare advises for AWS CLI 2.23 and later, whose default checksums R2 has refused
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [[ -z "${R2_ACCOUNT_ID}" || -z "${R2_BUCKET}" || -z "${AWS_ACCESS_KEY_ID}" || -z "${AWS_SECRET_ACCESS_KEY}" ]]; then
            echo "::error::The R2 secrets are not set, so the ISO cannot be uploaded"
            exit 1
          fi
          # The ISO first, so that the checksum is never replaced before the ISO it describes
          for file in "${ISO}" "${ISO}.sha256" "${ISO}.sha256.bundle"; do
            aws s3 cp --no-progress \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              "${file}" "s3://${R2_BUCKET}/${file}"
          done
