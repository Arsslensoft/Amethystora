name: Lab

# The VM lab (tests/vm) on GitHub's runners, as bootc runs its integration tests: the image is built from the commit once,
# installed onto the lab's disks and signed in (the ready state), and the suites are spread over lanes that each run on a
# runner of their own, one VM at a time, from what the build job handed them (tests/vm/README.md, On GitHub). Every job
# runs `bash tests/vm/run.sh` as a machine with the lab does, so a failure here is tried again there the same way. It
# holds no secret, builds with throwaway keys and publishes nothing. A pull request runs it once it has the label `lab`;
# the job named Lab says whether every suite passed.

on:
  workflow_dispatch:
    inputs:
      image:
        description: The image to build and test
        type: choice
        default: amethystora
        options:
          - amethystora
          - amethystora-dx
          - amethystora-nvidia-open
          - amethystora-dx-nvidia-open
          - amethystora-nvidia-lts
          - amethystora-dx-nvidia-lts
      stream:
        description: The stream to build
        type: choice
        default: latest
        options: [latest, beta, stable]
      suites:
        description: "Only these suites, by number or name (11,50-raid.sh); empty for every suite"
        type: string
        default: ""
      lanes:
        description: How many runners the suites are spread over (1 to 12)
        type: number
        default: 10
  pull_request:
    types: [labeled, synchronize, reopened]

permissions: {}

concurrency:
  # A new push to a pull request stops its last run. A run started by hand stops none, and nor does a label other than
  # lab, whose run does nothing
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' &&
    (github.event.action != 'labeled' || github.event.label.name == 'lab') &&
    format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE: ${{ inputs.image || 'amethystora' }}
  STREAM: ${{ inputs.stream || 'latest' }}
  SUITES: ${{ inputs.suites }}

jobs:
  # The lanes, by the suites' minutes in tests/vm/shards.json, as `run.sh plan --parallel N` prints them
  plan:
    name: Plan
    if: >-
      ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'lab') &&
      (github.event.action != 'labeled' || github.event.label.name == 'lab')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      installer: ${{ steps.plan.outputs.installer }}
      lanes: ${{ steps.plan.outputs.lanes }}
      suites: ${{ steps.plan.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Plan the lanes
        id: plan
        env:
          LANES: ${{ inputs.lanes || 10 }}
          VMLAB_DIR: ${{ runner.temp }}/vm
        run: |
          args=(plan --parallel "${LANES}" --json)
          [[ -z "${SUITES}" ]] || args+=(--suites "${SUITES}")
          plan="$(node tests/vm/run.mjs "${args[@]}")"
          for key in ready installer lanes suites; do
            echo "${key}=$(jq -c -r ".${key}" <<<"${plan}")" >> "$GITHUB_OUTPUT"
          done
          jq -r '"Lanes for \(env.IMAGE):\(env.STREAM):", (.lanes[] | "- lane \(.lane), about \(.minutes) min: \(.suites)")' <<<"${plan}" \
            >> "$GITHUB_STEP_SUMMARY"

  # The image from the commit, the disks the lanes start from, and the ready state, each kept as an artifact for a day
  build:
    name: Build, install, sign in
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      # The whole history: run.sh hands the lab a git bundle of HEAD, and what's new reads the commits since the last image
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # master
        with:
          extra-squeeze: true

      - name: Start the lab
        run: |
          [[ -c /dev/kvm ]] || { echo "::error::This runner has no /dev/kvm"; exit 1; }
          echo "VMLAB_VOLUME=${RUNNER_TEMP}/vm" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/vm"
          VMLAB_VOLUME="${RUNNER_TEMP}/vm" bash tests/vm/setup.sh

      - name: Build the image
        run: bash tests/vm/run.sh build --image "${IMAGE}" --tag "${STREAM}"

      # Compressed, to send; the image is not needed afterwards, and the ready state needs the room
      - name: Install it onto the lab's disks
        env:
          VMLAB_COMPRESS: 1
        run: |
          args=(disk)
          [[ -z "${SUITES}" ]] || args+=(--suites "${SUITES}")
          bash tests/vm/run.sh "${args[@]}"
          docker exec amevm podman system reset --force

      - name: Keep the disk
        if: needs.plan.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-disk
          path: |
            ${{ runner.temp }}/vm/disks/test.qcow2
            ${{ runner.temp }}/vm/disks/test.vars.json
            ${{ runner.temp }}/vm/disks/test.digest
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: Keep the installer's disk
        if: needs.plan.outputs.installer == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-disk-installer
          path: |
            ${{ runner.temp }}/vm/disks/test-installer.qcow2
            ${{ runner.temp }}/vm/disks/test-installer.vars.json
            ${{ runner.temp }}/vm/disks/test-installer.digest
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: Sign in (the ready state)
        if: needs.plan.outputs.ready == 'true'
        run: bash tests/vm/run.sh ready

      - name: Pack the ready state
        if: needs.plan.outputs.ready == 'true'
        run: |
          sudo tar -C "${VMLAB_VOLUME}/vms" -cf - test.qcow2 test.vars.json test.tpm test.ready |
            zstd -T0 -3 -q -o "${RUNNER_TEMP}/ready.tar.zst"

      - name: Keep the ready state
        if: needs.plan.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-ready
          path: ${{ runner.temp }}/ready.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: Collect the run's files
        if: always()
        run: bash tests/vm/ci-collect.sh

      - name: Keep the run's files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-run-build
          path: ${{ runner.temp }}/runs
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  # One lane each: its installer suites on a fresh machine of the installer's disk, the rest from the ready state
  lane:
    name: Lane ${{ matrix.lane }}
    needs: [plan, build]
    if: needs.plan.outputs.lanes != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.lanes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # master

      - name: Fetch the disk
        if: matrix.ready
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lab-disk
          path: ${{ runner.temp }}/vm/disks

      - name: Fetch the installer's disk
        if: matrix.installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lab-disk-installer
          path: ${{ runner.temp }}/vm/disks

      - name: Fetch the ready state
        if: matrix.ready
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lab-ready
          path: ${{ runner.temp }}

      - name: Start the lab
        run: |
          [[ -c /dev/kvm ]] || { echo "::error::This runner has no /dev/kvm"; exit 1; }
          echo "VMLAB_VOLUME=${RUNNER_TEMP}/vm" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/vm/vms"
          if [[ -f "${RUNNER_TEMP}/ready.tar.zst" ]]; then
            zstd -dc "${RUNNER_TEMP}/ready.tar.zst" | sudo tar -C "${RUNNER_TEMP}/vm/vms" -xf -
            rm -f "${RUNNER_TEMP}/ready.tar.zst"
          fi
          VMLAB_VOLUME="${RUNNER_TEMP}/vm" bash tests/vm/setup.sh

      - name: Run the lane's suites
        env:
          LANE_SUITES: ${{ matrix.suites }}
        run: bash tests/vm/run.sh test --parallel 1 --reuse --suites "${LANE_SUITES}"

      - name: Collect the run's files
        if: always()
        run: bash tests/vm/ci-collect.sh

      - name: Keep the run's files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-run-lane-${{ matrix.lane }}
          path: ${{ runner.temp }}/runs
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  # Every job's results in one table; the one check to require
  report:
    name: Lab
    needs: [plan, build, lane]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Each job's files in a folder of its own, named after it; none when a job ended before it had any
      - name: Fetch the runs' files
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lab-run-*
          path: ${{ runner.temp }}/runs

      - name: Report
        env:
          EXPECT: ${{ needs.plan.outputs.suites }}
          BUILD_RESULT: ${{ needs.build.result }}
          LANE_RESULT: ${{ needs.lane.result }}
          VMLAB_DIR: ${{ runner.temp }}/vm
        run: |
          status=0
          node tests/vm/run.mjs report "${RUNNER_TEMP}/runs" --expect "${EXPECT}" >"${RUNNER_TEMP}/report.md" || status=1
          tee -a "$GITHUB_STEP_SUMMARY" <"${RUNNER_TEMP}/report.md"
          for job in "build:${BUILD_RESULT}" "lanes:${LANE_RESULT}"; do
            if [[ "${job#*:}" == failure || "${job#*:}" == cancelled ]]; then
              echo "::error::The ${job%%:*} job ended with ${job#*:}"
              status=1
            fi
          done
          exit "${status}"
