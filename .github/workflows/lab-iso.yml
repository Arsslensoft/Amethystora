name: Lab (ISOs)

# Installing, tried in the VM lab for every pull request: the image is built from the commit as the Lab builds it, its two
# ISOs are made from it as build-iso.yml makes them (the installer ISO by iso/build-installer-iso.sh, the live ISO by
# iso/live and Titanoboa), each on a runner of its own, and each is installed in a VM as a person installs it, the machine
# it made then started under Secure Boot and looked at (tests/vm/iso.sh, iso.mjs). The live ISO's forensic start is
# tried there too (tests/vm/forensic-live.sh). It holds no secret, builds with throwaway keys and publishes nothing:
# nothing here is uploaded but the run's files. A change to Markdown alone runs none of it, nor a merge group, whose
# pull requests ran it. The job named ISOs says whether both passed.

on:
  workflow_dispatch:
    inputs:
      image:
        description: The image to build, and make the ISOs of
        type: choice
        default: amethystora
        options:
          - amethystora
          - amethystora-dx
          - amethystora-nvidia-open
          - amethystora-dx-nvidia-open
          - amethystora-nvidia-lts
          - amethystora-dx-nvidia-lts
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE: ${{ inputs.image || 'amethystora' }}
  # The name both ISOs install it by, as the published ones do (iso.toml's @IMAGE@:stable, installer.ks's BASE_IMAGE)
  IMAGE_REF: ghcr.io/arsslensoft/${{ inputs.image || 'amethystora' }}:stable

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      image_run: ${{ steps.plan.outputs.image_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Anything but Markdown
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${EVENT}" == pull_request ]] &&
            ! git diff --name-only "$(git merge-base "${BASE}" HEAD)" HEAD | grep -qv '\.md$'; then
            echo "Only Markdown changed: no ISO to try" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          # A file tests/vm/iso-image-run with the number of an earlier run of this workflow, whose image is still kept
          # (a day), takes that image instead of building one: for trying a change to the ISO tests alone, which the
          # image does not depend on. It is a number and nothing else, and is not kept in the repository
          image_run=""
          if [[ -f tests/vm/iso-image-run ]]; then
            image_run="$(tr -d '[:space:]' < tests/vm/iso-image-run)"
            [[ "${image_run}" =~ ^[0-9]{6,15}$ ]] || { echo "::error::tests/vm/iso-image-run is a run number"; exit 1; }
            echo "The image of run ${image_run} is used, not built" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "image_run=${image_run}" >> "$GITHUB_OUTPUT"

  # The image, built in the lab from the commit as the Lab builds it, handed on as an OCI archive
  image:
    name: Image
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.image_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # master
        with:
          extra-squeeze: true

      - name: Start the lab
        run: |
          echo "VMLAB_VOLUME=${RUNNER_TEMP}/vm" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/vm"
          VMLAB_VOLUME="${RUNNER_TEMP}/vm" bash tests/vm/setup.sh

      - name: Build the image
        run: bash tests/vm/run.sh build --image "${IMAGE}" --tag latest

      - name: Pack the image
        run: |
          docker exec amevm podman save --format oci-archive -o /vm/image.tar localhost/amethystora-run:test
          docker exec amevm podman system reset --force
          sudo zstd -T0 -3 -q --rm "${VMLAB_VOLUME}/image.tar" -o "${RUNNER_TEMP}/image.tar.zst"
          sudo chmod a+r "${RUNNER_TEMP}/image.tar.zst"

      - name: Keep the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso-image
          path: ${{ runner.temp }}/image.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: Collect the run's files
        if: always()
        run: bash tests/vm/ci-collect.sh

      - name: Keep the run's files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso-run-image
          path: ${{ runner.temp }}/runs
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  # The installer ISO, as build-iso.yml's ISO job makes it, installed with the answers alone
  installer:
    name: Installer ISO
    needs: [plan, image]
    if: always() && needs.plan.outputs.run == 'true' && (needs.image.result == 'success' || needs.plan.outputs.image_run != '')
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # master
        with:
          remove-codeql: true

      - name: Fetch the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso-image
          path: ${{ runner.temp }}
          run-id: ${{ needs.plan.outputs.image_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Load the image
        id: load
        run: |
          [[ -c /dev/kvm ]] || { echo "::error::This runner has no /dev/kvm"; exit 1; }
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' |
            sudo tee /etc/containers/storage.conf > /dev/null
          zstd -dc "${RUNNER_TEMP}/image.tar.zst" > "${RUNNER_TEMP}/image.tar"
          rm "${RUNNER_TEMP}/image.tar.zst"
          # The archive keeps the name the lab built it under
          sudo podman load -q -i "${RUNNER_TEMP}/image.tar"
          rm "${RUNNER_TEMP}/image.tar"
          sudo podman tag localhost/amethystora-run:test "${IMAGE_REF}"
          echo "digest=$(sudo podman image inspect --format '{{.Digest}}' "${IMAGE_REF}")" >> "$GITHUB_OUTPUT"
          # The image's helpers and recipes, which the installed machine must have (tests/vm/iso.mjs's FILES_OF): the
          # ISO's builder repacks the image, so its digest is not the installed one
          # shellcheck disable=SC2016
          files="$(sudo podman run --rm --entrypoint /usr/bin/bash "${IMAGE_REF}" -c \
            'export LC_ALL=C; sha256sum /usr/libexec/amethystora-* /usr/share/amethystora/just/*.just | sha256sum | cut -d" " -f1')"
          echo "files=${files}" >> "$GITHUB_OUTPUT"

      - name: Build the installer ISO
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio isomd5sum xorriso
          sudo bash iso/build-installer-iso.sh "${IMAGE_REF}" "${RUNNER_TEMP}/installer.iso"
          ls -l "${RUNNER_TEMP}/installer.iso" >> "$GITHUB_STEP_SUMMARY"

      # The ISO's builder and the image need the room the lab's VMs take
      - name: Start the lab
        run: |
          sudo podman system reset --force
          sudo rm -rf output product product.img
          echo "VMLAB_VOLUME=${RUNNER_TEMP}/vm" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/vm"
          VMLAB_VOLUME="${RUNNER_TEMP}/vm" bash tests/vm/setup.sh

      - name: Install from it, start what it installed
        env:
          DIGEST: ${{ steps.load.outputs.digest }}
          FILES: ${{ steps.load.outputs.files }}
        run: bash tests/vm/iso.sh installer "${RUNNER_TEMP}/installer.iso" --digest "${DIGEST}" --files "${FILES}"

      - name: Keep the run's files
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/runs"
          if [[ -d "${VMLAB_VOLUME}/iso/installer" ]]; then
            sudo cp -r "${VMLAB_VOLUME}/iso/installer" "${RUNNER_TEMP}/runs/"
            sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/runs"
            { echo '### Installer ISO'; echo '```'; cat "${RUNNER_TEMP}/runs/installer/results.tap"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload the run's files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso-run-installer
          path: ${{ runner.temp }}/runs
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  # The live ISO, as build-iso.yml's live-iso job makes it (keep the two in step): the live session, its forensic start,
  # and installing from the session
  live:
    name: Live ISO
    needs: [plan, image]
    if: always() && needs.plan.outputs.run == 'true' && (needs.image.result == 'success' || needs.plan.outputs.image_run != '')
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # master
        with:
          remove-codeql: true

      - name: Fetch the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso-image
          path: ${{ runner.temp }}
          run-id: ${{ needs.plan.outputs.image_run || github.run_id }}
          github-token: ${{ github.token }}

      # The archive stays for the build, which takes the copy the live system installs from it (LIVE_COPY_FROM) rather
      # than from a registry, which has no image of this commit
      - name: Load the image
        id: load
        run: |
          [[ -c /dev/kvm ]] || { echo "::error::This runner has no /dev/kvm"; exit 1; }
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' |
            sudo tee /etc/containers/storage.conf > /dev/null
          mkdir -p "${RUNNER_TEMP}/lab"
          zstd -dc "${RUNNER_TEMP}/image.tar.zst" > "${RUNNER_TEMP}/lab/image.tar"
          rm "${RUNNER_TEMP}/image.tar.zst"
          # The archive keeps the name the lab built it under
          sudo podman load -q -i "${RUNNER_TEMP}/lab/image.tar"
          sudo podman tag localhost/amethystora-run:test "${IMAGE_REF}"
          echo "digest=$(sudo podman image inspect --format '{{.Digest}}' "${IMAGE_REF}")" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          files="$(sudo podman run --rm --entrypoint /usr/bin/bash "${IMAGE_REF}" -c \
            'export LC_ALL=C; sha256sum /usr/libexec/amethystora-* /usr/share/amethystora/just/*.just | sha256sum | cut -d" " -f1')"
          echo "files=${files}" >> "$GITHUB_OUTPUT"

      - name: Build the live system
        env:
          DIGEST: ${{ steps.load.outputs.digest }}
        run: |
          sudo podman build --pull=never --cap-add sys_admin --security-opt label=disable \
            --volume "${RUNNER_TEMP}/lab:/run/lab:ro" \
            --build-arg BASE_IMAGE="${IMAGE_REF}" --build-arg BASE_DIGEST="${DIGEST}" \
            --build-arg LIVE_COPY_FROM=oci-archive:/run/lab/image.tar \
            --tag localhost/amethystora-live:stable --file iso/live/Containerfile iso
          rm -f "${RUNNER_TEMP}/lab/image.tar"

      - name: Pin the Fedora Titanoboa builds in
        run: |
          fedora="$(sed -nE 's/^fedora_image := "([^"]+):[^:@"]+@(sha256:[a-f0-9]{64})"$/\1@\2/p' Justfile)"
          [[ -n "${fedora}" ]]
          sudo podman pull "${fedora}"
          sudo podman tag "${fedora}" quay.io/fedora/fedora:latest

      - name: Build ISO
        id: titanoboa
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4 # main
        with:
          image-ref: localhost/amethystora-live:stable

      - name: List the live system's packages
        run: |
          sudo podman run --rm --entrypoint rpm localhost/amethystora-live:stable \
            -qa --queryformat '%{NAME}\t%{VERSION}-%{RELEASE}\t%{LICENSE}\n' | sort > LIVE-PACKAGES
          if awk -F'\t' '$1 == "fedora-logos" || $1 ~ /^fedora-release/ { found = 1 } END { exit !found }' LIVE-PACKAGES; then
            echo "::error::The live system carries Fedora's logo or release package"
            exit 1
          fi

      - name: Add the licences
        env:
          LIVE_ISO: ${{ steps.titanoboa.outputs.iso-dest }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso
          xorriso -indev "${LIVE_ISO}" -outdev "${RUNNER_TEMP}/live.iso" -boot_image any replay \
            -map LICENSE /LICENSE -map NOTICE /NOTICE -map LIVE-PACKAGES /LIVE-PACKAGES
          sudo rm -f "${LIVE_ISO}"

      - name: Check the boot menu
        run: |
          xorriso -osirrox on -indev "${RUNNER_TEMP}/live.iso" -extract /boot/grub2/grub.cfg grub.cfg
          grep -qF "menuentry 'Start without touching the disks" grub.cfg
          entry="$(grep -A1 -F "menuentry 'Start without touching the disks" grub.cfg | grep -E '^ +linux ')"
          for arg in $(sed -n '/^ARGS=(/,/)$/p' iso/live/forensic/amethystora-forensic | sed -e 's/^ARGS=(//' -e 's/)$//'); do
            [[ " ${entry} " == *" ${arg} "* ]] || { echo "::error::The forensic boot entry lacks ${arg}"; exit 1; }
          done
          [[ "$(grep -cE '^ +linux .*amethystora\.forensic=1' grub.cfg)" == 1 ]]
          [[ "$(grep -cE '^menuentry ' grub.cfg)" == 3 ]]

      - name: Start the lab
        run: |
          sudo podman system reset --force
          echo "VMLAB_VOLUME=${RUNNER_TEMP}/vm" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/vm"
          VMLAB_VOLUME="${RUNNER_TEMP}/vm" bash tests/vm/setup.sh

      # Before the installation, which takes the ISO: the disks of a seized computer, started from the third entry, must
      # come out byte for byte as they went in, and the first entry, which mounts them, must not (the control)
      - name: The forensic start
        run: |
          bash tests/vm/forensic-live.sh disk
          bash tests/vm/forensic-live.sh "${RUNNER_TEMP}/live.iso"
          bash tests/vm/forensic-live.sh "${RUNNER_TEMP}/live.iso" --control
          docker exec amevm rm -f /vm/forensic/live.iso /vm/forensic/evidence.raw

      - name: Install from the live session, start what it installed
        if: success() || failure()
        env:
          DIGEST: ${{ steps.load.outputs.digest }}
          FILES: ${{ steps.load.outputs.files }}
        run: bash tests/vm/iso.sh live "${RUNNER_TEMP}/live.iso" --digest "${DIGEST}" --files "${FILES}"

      - name: Keep the run's files
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/runs"
          if [[ -d "${VMLAB_VOLUME}/iso/live" ]]; then
            sudo cp -r "${VMLAB_VOLUME}/iso/live" "${RUNNER_TEMP}/runs/"
            sudo find "${VMLAB_VOLUME}/vms" -maxdepth 1 -name 'forensic.*' \( -name '*.serial' -o -name '*.log' \) -exec cp -t "${RUNNER_TEMP}/runs" {} + || true
            sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/runs"
            { echo '### Live ISO'; echo '```'; cat "${RUNNER_TEMP}/runs/live/results.tap"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload the run's files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso-run-live
          path: ${{ runner.temp }}/runs
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  # The one check to require
  isos:
    name: ISOs
    needs: [plan, image, installer, live]
    if: always() && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Both ISOs installed
        env:
          RESULTS: ${{ needs.image.result }} ${{ needs.installer.result }} ${{ needs.live.result }}
          REUSED: ${{ needs.plan.outputs.image_run }}
        run: |
          echo "Image, installer ISO, live ISO: ${RESULTS}"
          [[ -z "${REUSED}" ]] || RESULTS="${RESULTS/skipped/success}"
          [[ "${RESULTS}" == "success success success" ]]
