name: Integration tests

# Each helper of the image against stand-ins for what it reads and runs (tests/ci/tests.txt's integration lines, the
# commands 20-tests.sh runs), in the last published image with this change's system_files laid over it
# (tests/ci/in-image.sh), spread over four runners. A helper that needs a program or package the change adds is tested by
# the image build's 20-tests.sh and the Lab until it is published. They hold no secret and publish nothing. The job named
# Integration says whether every shard passed.

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: Shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # master

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: The shard's tests in the image
        env:
          RESULTS: ${{ runner.temp }}/results
          SHARD: ${{ matrix.shard }}
        run: |
          status=0
          sudo --preserve-env=RESULTS env "PATH=${PATH}" bash tests/ci/in-image.sh integration "${SHARD}/4" || status=1
          cat "${RESULTS}/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit "${status}"

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-shard-${{ matrix.shard }}-logs
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
          retention-days: 14

  # The one check to require
  integration:
    name: Integration
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.shard.result }}
        run: |
          echo "The shards: ${RESULT}"
          [[ "${RESULT}" == success ]]
