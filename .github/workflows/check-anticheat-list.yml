name: Check Anti-Cheat List
on:
  schedule:
    - cron: "30 6 * * 1" # Mondays
  workflow_dispatch:
  pull_request:
    paths:
      - system_files/shared/usr/share/amethystora/anticheat-list.json
      - system_files/shared/usr/share/licenses/areweanticheatyet/**
      - .github/workflows/check-anticheat-list.yml

# What `amethystora-will-it-run` answers from is a trimmed copy of a community list of games and the state of their anti-cheat on
# Linux, kept at one commit (system_files/shared/usr/share/amethystora/anticheat-list.json, made by
# build_files/shared/trim-anticheat-list.mjs, with its licence and SOURCE in usr/share/licenses/areweanticheatyet). The list changes
# often and nothing follows it by itself: this looks weekly for a newer commit of its games.json and says so, and fails once the copy is
# more than ninety days behind. It also fails if the list's repository is no longer under the MIT License, since the copy ships on that
# licence alone. Moving to a newer commit is by hand (see SOURCE). The image build only checks the copy's shape (20-tests.sh).

permissions: {}

jobs:
  newer-commit:
    name: Newer commit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Ask GitHub
        env:
          LIST: system_files/shared/usr/share/amethystora/anticheat-list.json
          API: https://api.github.com/repos/AreWeAntiCheatYet/AreWeAntiCheatYet
        run: |
          set -euo pipefail
          pinned="$(jq -r .commit "${LIST}")"
          updated="$(jq -r .updated "${LIST}")"
          licence="$(curl -fsS --retry 3 "${API}" | jq -r '.license.spdx_id')"
          if [[ "${licence}" != MIT ]]; then
            echo "::error::The list's repository is under ${licence}, not the MIT License the copy ships on: stop shipping it until that is settled"
            exit 1
          fi
          latest="$(curl -fsS --retry 3 "${API}/commits?path=games.json&per_page=1")"
          newest="$(jq -r '.[0].sha' <<<"${latest}")"
          date="$(jq -r '.[0].commit.committer.date[:10]' <<<"${latest}")"
          if [[ "${newest}" == "${pinned}" ]]; then
            echo "The copy is at the list's latest commit of games.json (${pinned}, ${date})."
            exit 0
          fi
          age=$((($(date -u +%s) - $(date -u -d "${updated}" +%s)) / 86400))
          echo "::notice::A newer commit of games.json exists (${newest}, ${date}); the copy is of ${pinned} (${updated}), ${age} days old"
          if ((age > 90)); then
            echo "::error::The copy of the list is ${age} days old and a newer commit exists: move to it by hand (usr/share/licenses/areweanticheatyet/SOURCE)"
            exit 1
          fi
